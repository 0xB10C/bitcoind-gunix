# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: cachix/cachix-action@v17
        with:
          name: 0xb10c-bitcoind-gunix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      # The derivations' postFixup gates compare every produced binary's
      # sha256 (release.nix: all 10 binaries) and the assembled archive's
      # sha256 (tarball.nix) against the upstream GUIX v31.1rc1 release and
      # fail the build on mismatch — so a successful `nix build` IS the
      # reproducibility test. Building .#tarball also builds .#bitcoind.
      # The steps below re-assert the hashes externally for CI-log
      # visibility. (Building the Qt GUI makes the first build long; the
      # Cachix cache makes subsequent runs fast.)
      - run: nix build .#bitcoind -o result-bitcoind --print-build-logs
      - run: nix build .#tarball -o result-tarball --print-build-logs
      - name: Verify all 10 binaries match upstream GUIX v31.1rc1
        run: |
          declare -A expected=(
            [bin/bitcoin]=caa9c4cb517df25ce634542ef93823632641a063c96beb2d1544dfbaab160ca7
            [bin/bitcoin-cli]=6abd14456bd756226ac9b104301f024e162432b0ef25eac81a64df52b7e61b08
            [bin/bitcoind]=6affd25017d18116746f3a99a96162ed93c3b138ce0d5cc54095563dc9637b21
            [bin/bitcoin-tx]=7d614b4ba22ffdd8934fbf49fa0fbdb5eea051addfaaede38a785d5d00c9d412
            [bin/bitcoin-util]=2d0b1828cac470db1f574525f9df21f904cb6fb314dbe28a2ce531d20b77f4a3
            [bin/bitcoin-wallet]=d04185a69379e1dd06c547982908402532fe71549d6aaf01febdfc8fa7044bbb
            [bin/bitcoin-qt]=161d9b2dd1dfcd579bbdd0a1192ed224aa1233347c5a7330566cddbd1b7bd89b
            [libexec/bitcoin-node]=720ca74ddea34791719f2843f60b7f09b5c54d28512a7d1f6534fbd3c44d11c9
            [libexec/bitcoin-gui]=4ddd713b632ca9872a8e4e73458742134001264829bcdac51f6c18c869490579
            [libexec/test_bitcoin]=d891b01337f5ec686b8bd5c4e6a17b41abd046699f94e4af48652064f67b4d2e
          )
          rc=0
          for rel in "${!expected[@]}"; do
            actual=$(sha256sum "result-bitcoind/$rel" | cut -d' ' -f1)
            if [ "$actual" = "${expected[$rel]}" ]; then
              echo "OK:   $rel"
            else
              echo "FAIL: $rel  expected ${expected[$rel]}  actual $actual"; rc=1
            fi
          done
          exit $rc
      - name: Verify bitcoin-31.1rc1-x86_64-linux-gnu.tar.gz matches upstream GUIX v31.1rc1
        run: |
          expected=26bdfbeeea4330ea67e56edcb58b183c3fbfeb4d5bc32f75b0e7d7b8d6b14ffa
          actual=$(sha256sum result-tarball | cut -d' ' -f1)
          echo "expected: $expected"
          echo "actual:   $actual"
          [ "$actual" = "$expected" ]

  # The aarch64 release is cross-compiled on the same x86_64 runner (no qemu —
  # the build only emits aarch64 ELFs, it never runs them). Kept as a separate
  # job from the x86_64 build because it's a long, independent build (its own
  # gcc 14 / glibc 2.31 / binutils 2.41 cross toolchain + Qt6 cross depends);
  # running in parallel keeps either result visible without waiting on the
  # other, and a failure points squarely at one architecture.
  build-aarch64:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: cachix/cachix-action@v17
        with:
          name: 0xb10c-bitcoind-gunix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      # bitcoind-aarch64.nix's postFixup gates all 10 aarch64 binaries and
      # tarball.nix gates the archive sha256 against the upstream GUIX v31.1rc1
      # aarch64-linux-gnu release, so a successful build IS the reproducibility
      # test. Building .#tarballAarch64 also builds .#bitcoindAarch64. The
      # steps below re-assert the hashes externally for CI-log visibility.
      - run: nix build .#bitcoindAarch64 -o result-bitcoind --print-build-logs
      - run: nix build .#tarballAarch64 -o result-tarball --print-build-logs
      - name: Verify all 10 aarch64 binaries match upstream GUIX v31.1rc1
        run: |
          declare -A expected=(
            [bin/bitcoin]=347ca9d7291dccb728f5f5ae79228106c8d97b63237f6bf928aa4e35add33079
            [bin/bitcoin-cli]=93eed022dba9e1c2de1630931d2a3ed61d6476ef72dc4a3840833832cb5eb3f3
            [bin/bitcoind]=7df45d8bf3b013ec0b7a9c617f2007ad33fb220449e03e69ffcfccc1943b5116
            [bin/bitcoin-tx]=fd1844e290149ae3c7dadf3ef8afbf3a95ca4f08554716c73ce6c07eb34fea56
            [bin/bitcoin-util]=37ae6248570deb0f838ff391d1339757dc455fdd88cda45b1eb52bdf7dd81f48
            [bin/bitcoin-wallet]=d6f2bfcf96716de133a24bff46555fcbf37257dd56a9f87a1ee45499f09745c7
            [bin/bitcoin-qt]=d0b5b571ee4f9817eb1d61e3eaa2247c8c4c92d40944b53bee22d71446778d2c
            [libexec/bitcoin-node]=e20aab227423625a498316d929ced4ec8fb68afdcf3953823da574fe69463ed9
            [libexec/bitcoin-gui]=937b9128a6a61c30b0791fb750fa88be340bc573317ba356530a508306573550
            [libexec/test_bitcoin]=e6489ead290b4dc6eb07a6f7365659341ca460208c5da2c58ecf835bef41065b
          )
          rc=0
          for rel in "${!expected[@]}"; do
            actual=$(sha256sum "result-bitcoind/$rel" | cut -d' ' -f1)
            if [ "$actual" = "${expected[$rel]}" ]; then
              echo "OK:   $rel"
            else
              echo "FAIL: $rel  expected ${expected[$rel]}  actual $actual"; rc=1
            fi
          done
          exit $rc
      - name: Verify bitcoin-31.1rc1-aarch64-linux-gnu.tar.gz matches upstream GUIX v31.1rc1
        run: |
          expected=4846f0e6feeef19025ebcc31dfd14339ef45f078bde7e1a758786f06b1167185
          actual=$(sha256sum result-tarball | cut -d' ' -f1)
          echo "expected: $expected"
          echo "actual:   $actual"
          [ "$actual" = "$expected" ]

  # The riscv64 release, cross-compiled on the same x86_64 runner — the
  # exact analog of build-aarch64 (its own riscv64 cross toolchain +
  # cross depends; bitcoind-riscv64.nix gates all 20 artifacts, the
  # tarball drvs gate both archive sha256s).
  build-riscv64:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
