  # The two macOS releases, cross-built on the same x86_64 runner with the
  # bare clang/lld 19.1.4 toolchain + the Xcode SDK (fetched from the public
  # bitcoincore.org mirror). Each job builds the full chain for one host —
  # all five published artifacts (-unsigned.tar.gz/.zip, -codesigning.tar.gz,
  # signed .tar.gz/.zip) — every one self-gating against the upstream GUIX
  # v31.1rc1 hashes, then re-asserts them externally for log visibility. The
  # bitcoind step builds inside an unshare/userns chroot (for byte-identical
  # LC_UUIDs), which needs CLONE_NEWUSER; Ubuntu 24.04+'s AppArmor
  # unprivileged_userns_restriction blocks that for unconfined processes
  # (`unshare: write failed /proc/self/uid_map: Operation not permitted`), so
  # each job first disables it via sysctl. The SDK-embedding closures ARE
  # pushed to Cachix (the SDK is already public on the depends-sources
  # mirror).
  build-darwin-x86:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: cachix/cachix-action@v17
        with:
          name: 0xb10c-bitcoind-gunix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Allow unprivileged user namespaces (needed for the darwin chroot build)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: nix build .#tarballDarwinX86 -o result-unsigned-tar --print-build-logs
      - run: nix build .#zipDarwinX86 -o result-unsigned-zip --print-build-logs
      - run: nix build .#codesigningDarwinX86 -o result-codesigning --print-build-logs
      - run: nix build .#signedDarwinX86 -o result-signed --print-build-logs
      - name: Verify all 5 x86_64-apple-darwin artifacts match upstream GUIX v31.1rc1
        run: |
          declare -A expected=(
            [result-unsigned-tar]=c3d4318855349f2d931154473671de780f2643d8e1e1ecc4ed97b0cfa6c50db8
            [result-unsigned-zip]=31bb7c87c5dbea60b81c49ee43206be459fd54342f421d9c221f0ae508582183
            [result-codesigning]=e3bb6be108847b36567203dcab1482abb6ffc20d1fe2acc2357404fbc54ae018
            [result-signed/bitcoin-31.1rc1-x86_64-apple-darwin.tar.gz]=9e12bb6abf800b210cab2ff356a76ace787661bf6fc438726520d174b527aae8
            [result-signed/bitcoin-31.1rc1-x86_64-apple-darwin.zip]=c4186905f172a6b3bc21afa8d8e8e97c2f75578fc023a50d5091f80aef14a816
          )
          rc=0
          for f in "${!expected[@]}"; do
            actual=$(sha256sum "$f" | cut -d' ' -f1)
            if [ "$actual" = "${expected[$f]}" ]; then
              echo "OK:   $f"
            else
              echo "FAIL: $f  expected ${expected[$f]}  actual $actual"; rc=1
            fi
          done
          exit $rc

  build-darwin-arm64:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: cachix/cachix-action@v17
        with:
          name: 0xb10c-bitcoind-gunix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Allow unprivileged user namespaces (needed for the darwin chroot build)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: nix build .#tarballDarwinArm64 -o result-unsigned-tar --print-build-logs
      - run: nix build .#zipDarwinArm64 -o result-unsigned-zip --print-build-logs
      - run: nix build .#codesigningDarwinArm64 -o result-codesigning --print-build-logs
      - run: nix build .#signedDarwinArm64 -o result-signed --print-build-logs
      - name: Verify all 5 arm64-apple-darwin artifacts match upstream GUIX v31.1rc1
        run: |
          declare -A expected=(
            [result-unsigned-tar]=6ddf76fa6eab9bd032ba7a293b55286d9a57f4566025f7f216eb41159a864398
            [result-unsigned-zip]=b428a2c07c9fb44b70f0ded0868adfe34e00d79d2f96293c7507802298fa549e
            [result-codesigning]=7d29c298421461dd843e5326d652464e0f11f376112972a42f0c42cb03aba624
            [result-signed/bitcoin-31.1rc1-arm64-apple-darwin.tar.gz]=eea402015458eb42f635614a098c61365d2a77a5d54f8ce4ff65225f642da67f
            [result-signed/bitcoin-31.1rc1-arm64-apple-darwin.zip]=afa1048477c0db2a34cf5889c6558f47dcfcd67dbbd0aee3703203a9e0980a58
          )
          rc=0
          for f in "${!expected[@]}"; do
            actual=$(sha256sum "$f" | cut -d' ' -f1)
            if [ "$actual" = "${expected[$f]}" ]; then
              echo "OK:   $f"
            else
              echo "FAIL: $f  expected ${expected[$f]}  actual $actual"; rc=1
            fi
          done
          exit $rc

  # win64 (x86_64-w64-mingw32): the last issue-#6 target. bitcoindMingw's
  # postFixup gates all 16 hashes (8 PE binaries + 8 .dbg); the steps below
  # build + assert the 6 published archive/installer artifacts (unsigned +
  # debug zips, NSIS installer, codesigning tarball, signed installer +
  # signed zip).
  build-win64:
