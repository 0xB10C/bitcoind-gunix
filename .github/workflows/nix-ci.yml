# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: cachix/cachix-action@v17
        with:
          name: 0xb10c-bitcoind-gunix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      # The derivations' postFixup gates compare every produced binary's
      # sha256 (bitcoind.nix: all 10 binaries) and the assembled archive's
      # sha256 (tarball.nix) against the upstream GUIX v31.0 release and
      # fail the build on mismatch — so a successful `nix build` IS the
      # reproducibility test. Building .#tarball also builds .#bitcoind.
      # The steps below re-assert the hashes externally for CI-log
      # visibility. (Building the Qt GUI makes the first build long; the
      # Cachix cache makes subsequent runs fast.)
      - run: nix build .#bitcoind -o result-bitcoind --print-build-logs
      - run: nix build .#tarball -o result-tarball --print-build-logs
      - name: Verify all 10 binaries match upstream GUIX v31.0
        run: |
          declare -A expected=(
            [bin/bitcoin]=eb5670aebd2b32c79215e578d2a7162fd1c98181bc558cfb8d29a4240e736521
            [bin/bitcoin-cli]=3e92883f97850bc445ac033d26d55902dcb035fdf64f78c2c03c83216f083c5d
            [bin/bitcoind]=dae69848ae9aaadcc3aa697d1c92b1283273a59c8d87b220b29ddc2813e25eb6
            [bin/bitcoin-tx]=ce3b159c9985eca941b3071c4dc573a4cf92ed9ee27fc1cf68a28d8afe893b6c
            [bin/bitcoin-util]=1d18ee4b1539110f784288462b8173d2d35d3b768ecbc3df83ebaa2781eb4306
            [bin/bitcoin-wallet]=7d8382b86cce7fde4214f295f7e134a873f176556ee98bc6dcbf9b347a25acaf
            [bin/bitcoin-qt]=3480af8fad820759a6299ea94bb3bb66f490b87c10ba44b1d0f671af382ff178
            [libexec/bitcoin-node]=01c212ee592f4ecc649b7a13c8fc0976f2d823900c66cd11460edaa59bba21ca
            [libexec/bitcoin-gui]=416e79bbebec5506ac786557519f3f5fc3fb1936a4a6074685d5f0aa24e01801
            [libexec/test_bitcoin]=c7a2a9062256920fa4b92e330857dc12e7f89882f8a3930ecdc3350acf922f8f
          )
          rc=0
          for rel in "${!expected[@]}"; do
            actual=$(sha256sum "result-bitcoind/$rel" | cut -d' ' -f1)
            if [ "$actual" = "${expected[$rel]}" ]; then
              echo "OK:   $rel"
            else
              echo "FAIL: $rel  expected ${expected[$rel]}  actual $actual"; rc=1
            fi
          done
          exit $rc
      - name: Verify bitcoin-31.0-x86_64-linux-gnu.tar.gz matches upstream GUIX v31.0
        run: |
          expected=d3e4c58a35b1d0a97a457462c94f55501ad167c660c245cb1ffa565641c65074
          actual=$(sha256sum result-tarball | cut -d' ' -f1)
          echo "expected: $expected"
          echo "actual:   $actual"
          [ "$actual" = "$expected" ]

  # The aarch64 release is cross-compiled on the same x86_64 runner (no qemu —
  # the build only emits aarch64 ELFs, it never runs them). Kept as a separate
  # job from the x86_64 build because it's a long, independent build (its own
  # gcc 14 / glibc 2.31 / binutils 2.41 cross toolchain + Qt6 cross depends);
  # running in parallel keeps either result visible without waiting on the
  # other, and a failure points squarely at one architecture.
  build-aarch64:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: cachix/cachix-action@v17
        with:
          name: 0xb10c-bitcoind-gunix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      # bitcoind-aarch64.nix's postFixup gates all 10 aarch64 binaries and
      # tarball.nix gates the archive sha256 against the upstream GUIX v31.0
      # aarch64-linux-gnu release, so a successful build IS the reproducibility
      # test. Building .#tarballAarch64 also builds .#bitcoindAarch64. The
      # steps below re-assert the hashes externally for CI-log visibility.
      - run: nix build .#bitcoindAarch64 -o result-bitcoind --print-build-logs
      - run: nix build .#tarballAarch64 -o result-tarball --print-build-logs
      - name: Verify all 10 aarch64 binaries match upstream GUIX v31.0
        run: |
          declare -A expected=(
            [bin/bitcoin]=c793384c78c11b2125d0b68cc62b05fab7a96d6438f005f9e375f7d4a41bfe4c
            [bin/bitcoin-cli]=25c2743efb90ccaccbaea9f481e0a0357310af04b04f78b2320c0cc65ce12bf6
            [bin/bitcoind]=6f66822a44b4d4edd2a8ae1a11f63dd4db8d070e219c8eb54a3e2faa536409c2
            [bin/bitcoin-tx]=b41284232c62323a890bb8ba3befba1e1c4d197155461766a19618a0aaccda87
            [bin/bitcoin-util]=3a0daa1c1f840fc7f9ac18a29619aab071230ee5f9ef2690fd7f93f3b9003488
            [bin/bitcoin-wallet]=b7c2bb47030c7fb7e652c70a68c4c012cdd2e3562396423fc6c9ef01e0b589ac
            [bin/bitcoin-qt]=760c3de5ff9a54edfc6bf0c769df6dfe610aa9055d8ea0fa99edca4a62dc14d4
            [libexec/bitcoin-node]=f213271f7cec156be3d155c3c1012f4c226e2b9216a40215355a190105d1fad5
            [libexec/bitcoin-gui]=f85193a8b7f4323f612b92a5b7e19cda977f90bb9c26543d3f5277bf10c59291
            [libexec/test_bitcoin]=940fd792624130b36c1aef4fb4fc61723e622635478e7301bf37827caac9f1c5
          )
          rc=0
          for rel in "${!expected[@]}"; do
            actual=$(sha256sum "result-bitcoind/$rel" | cut -d' ' -f1)
            if [ "$actual" = "${expected[$rel]}" ]; then
              echo "OK:   $rel"
            else
              echo "FAIL: $rel  expected ${expected[$rel]}  actual $actual"; rc=1
            fi
          done
          exit $rc
      - name: Verify bitcoin-31.0-aarch64-linux-gnu.tar.gz matches upstream GUIX v31.0
        run: |
          expected=4de1d568dedd48604f75132421bc0abeca432639589b49a3909c81db3a813112
          actual=$(sha256sum result-tarball | cut -d' ' -f1)
          echo "expected: $expected"
          echo "actual:   $actual"
          [ "$actual" = "$expected" ]

  # The riscv64 release, cross-compiled on the same x86_64 runner — the
  # exact analog of build-aarch64 (its own riscv64 cross toolchain +
  # cross depends; bitcoind-riscv64.nix gates all 20 artifacts, the
  # tarball drvs gate both archive sha256s).
  build-riscv64:
    runs-on: ubuntu-latest

