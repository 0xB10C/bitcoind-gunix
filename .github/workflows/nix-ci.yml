      - run: nix build .#unsignedZipMingw -o result-unsigned-zip --print-build-logs
      - run: nix build .#debugZipMingw -o result-debug-zip --print-build-logs
      - run: nix build .#setupExeMingw -o result-setup-unsigned --print-build-logs
      - run: nix build .#codesigningMingw -o result-codesigning --print-build-logs
      - run: nix build .#signedMingw -o result-signed --print-build-logs
      - name: Verify all 6 win64 archive/installer artifacts match upstream GUIX v31.0
        run: |
          declare -A expected=(
            [result-unsigned-zip]=5ecd365b53a2896850178f90302375480933e6c85ef81bb8abe8675fd44e1d9c
            [result-debug-zip]=df3f8c2f6ce8fde8d2661d3c01f5265f90f938019d52e2f94acf2a9001af70ae
            [result-setup-unsigned]=ad31d4d82a0ddcf1340a447575ca958ee664656ca2e77282737898e1b8209ec8
            [result-codesigning]=62baf547357029ac557d6fbbe91742c4ba6c1461c19ed4fab5131d4300b74d93
            [result-signed/bitcoin-31.0-win64-setup.exe]=1893e819d7554ca43e6e812dc642bd1fb4570a4077b07a03180ad1041e74e223
            [result-signed/bitcoin-31.0-win64.zip]=82fd2c504a0f20a31d4d13bd407783d6fc7bf17622d0ce85228a9b92694e03f0
          )
          rc=0
          for f in "${!expected[@]}"; do
            actual=$(sha256sum "$f" | cut -d' ' -f1)
            if [ "$actual" = "${expected[$f]}" ]; then
              echo "OK:   $f"
            else
              echo "FAIL: $f  expected ${expected[$f]}  actual $actual"; rc=1
            fi
          done
          exit $rc

  # "Cross everywhere" verification on an AARCH64 build host. The flake
  # exposes the same pipeline per build system (attr names refer to the
  # TARGET), so on this arm runner `.#tarballAarch64` is an aarch64
  # cross-to-self build (the trivial cross) and `.#tarball` is the x86_64
  # release cross-compiled FROM aarch64. Every derivation gates the exact
  # same upstream hashes as the x86_64-hosted jobs above — success here
  # proves the outputs are build-host-independent. Nothing in these jobs
  # shares store paths with the x86_64-hosted Cachix entries (different
  # build-host drvs), so the first run is a long cold build; Cachix caches
  # subsequent runs.
  build-on-aarch64-host:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: cachix/cachix-action@v17
        with:
          name: 0xb10c-bitcoind-gunix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix build .#tarballAarch64 -o result-tarball --print-build-logs
      - name: Verify aarch64-on-aarch64 (cross-to-self) tarball matches upstream
        run: |
          expected=4de1d568dedd48604f75132421bc0abeca432639589b49a3909c81db3a813112
          actual=$(sha256sum result-tarball | cut -d' ' -f1)
          echo "expected: $expected"
          echo "actual:   $actual"
          [ "$actual" = "$expected" ]

  build-x86-target-on-aarch64-host:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
