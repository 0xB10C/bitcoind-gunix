# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Every derivation self-gates against the checked-in noncodesigned.SHA256SUMS
# (from bitcoin-core/guix.sigs), so a successful `nix build` IS the
# reproducibility test. The verify steps below re-assert the archive hashes
# externally for CI-log visibility, reading the expected values from the same
# checked-in file (single source of truth — no hardcoded hashes in this
# workflow). Signed darwin/win64 artifacts and the codesignatures archive are
# built but not asserted: they only appear in upstream's all.SHA256SUMS,
# which is not published yet.
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: cachix/cachix-action@v17
        with:
          name: 0xb10c-bitcoind-gunix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      # tarball.nix gates both archive sha256s against the checked-in
      # noncodesigned.SHA256SUMS during the build. Building the tarballs
      # also builds .#bitcoind (which prints the per-binary hashes — no
      # per-binary reference hashes are published). (Building the Qt GUI
      # makes the first build long; the Cachix cache makes subsequent
      # runs fast.)
      - run: nix build .#bitcoind -o result-bitcoind --print-build-logs
      - run: nix build .#tarball -o result-tarball --print-build-logs
      - run: nix build .#debugTarball -o result-debug-tarball --print-build-logs
      - name: Verify x86_64-linux-gnu archives match checked-in noncodesigned.SHA256SUMS
        run: |
          check() { # <result-path> <published-filename>
            expected=$(awk -v f="$2" '$2==f{print $1}' noncodesigned.SHA256SUMS)
            [ -n "$expected" ] || { echo "MISSING: $2 not in noncodesigned.SHA256SUMS"; return 1; }
            actual=$(sha256sum "$1" | cut -d' ' -f1)
            echo "$2"; echo "  expected: $expected"; echo "  actual:   $actual"
            [ "$actual" = "$expected" ]
          }
          check result-tarball bitcoin-31.1-x86_64-linux-gnu.tar.gz
          check result-debug-tarball bitcoin-31.1-x86_64-linux-gnu-debug.tar.gz

  # The aarch64 release is cross-compiled on the same x86_64 runner (no qemu —
  # the build only emits aarch64 ELFs, it never runs them). Kept as a separate
  # job from the x86_64 build because it's a long, independent build (its own
  # gcc 14 / glibc 2.31 / binutils 2.41 cross toolchain + Qt6 cross depends);
  # running in parallel keeps either result visible without waiting on the
  # other, and a failure points squarely at one architecture.
  build-aarch64:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: cachix/cachix-action@v17
        with:
          name: 0xb10c-bitcoind-gunix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix build .#bitcoindAarch64 -o result-bitcoind --print-build-logs
      - run: nix build .#tarballAarch64 -o result-tarball --print-build-logs
      - run: nix build .#debugTarballAarch64 -o result-debug-tarball --print-build-logs
      - name: Verify aarch64-linux-gnu archives match checked-in noncodesigned.SHA256SUMS
        run: |
          check() { # <result-path> <published-filename>
            expected=$(awk -v f="$2" '$2==f{print $1}' noncodesigned.SHA256SUMS)
            [ -n "$expected" ] || { echo "MISSING: $2 not in noncodesigned.SHA256SUMS"; return 1; }
            actual=$(sha256sum "$1" | cut -d' ' -f1)
            echo "$2"; echo "  expected: $expected"; echo "  actual:   $actual"
            [ "$actual" = "$expected" ]
          }
          check result-tarball bitcoin-31.1-aarch64-linux-gnu.tar.gz
          check result-debug-tarball bitcoin-31.1-aarch64-linux-gnu-debug.tar.gz

  # The riscv64 release, cross-compiled on the same x86_64 runner — the
  # exact analog of build-aarch64 (its own riscv64 cross toolchain +
  # cross depends; the tarball drvs gate both archive sha256s).
  build-riscv64:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: cachix/cachix-action@v17
        with:
          name: 0xb10c-bitcoind-gunix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix build .#bitcoindRiscv64 -o result-bitcoind --print-build-logs
      - run: nix build .#tarballRiscv64 -o result-tarball --print-build-logs
      - run: nix build .#debugTarballRiscv64 -o result-debug-tarball --print-build-logs
      - name: Verify riscv64-linux-gnu archives match checked-in noncodesigned.SHA256SUMS
        run: |
          check() { # <result-path> <published-filename>
            expected=$(awk -v f="$2" '$2==f{print $1}' noncodesigned.SHA256SUMS)
            [ -n "$expected" ] || { echo "MISSING: $2 not in noncodesigned.SHA256SUMS"; return 1; }
            actual=$(sha256sum "$1" | cut -d' ' -f1)
            echo "$2"; echo "  expected: $expected"; echo "  actual:   $actual"
            [ "$actual" = "$expected" ]
          }
          check result-tarball bitcoin-31.1-riscv64-linux-gnu.tar.gz
          check result-debug-tarball bitcoin-31.1-riscv64-linux-gnu-debug.tar.gz

  # The armhf and powerpc64 releases. The tarball drvs gate both archive
  # sha256s internally; these jobs re-assert them externally.
  build-armhf:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: cachix/cachix-action@v17
        with:
          name: 0xb10c-bitcoind-gunix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix build .#tarballArmhf -o result-tarball --print-build-logs
      - run: nix build .#debugTarballArmhf -o result-debug-tarball --print-build-logs
      - name: Verify arm-linux-gnueabihf archives match checked-in noncodesigned.SHA256SUMS
        run: |
          check() { # <result-path> <published-filename>
            expected=$(awk -v f="$2" '$2==f{print $1}' noncodesigned.SHA256SUMS)
            [ -n "$expected" ] || { echo "MISSING: $2 not in noncodesigned.SHA256SUMS"; return 1; }
            actual=$(sha256sum "$1" | cut -d' ' -f1)
            echo "$2"; echo "  expected: $expected"; echo "  actual:   $actual"
            [ "$actual" = "$expected" ]
          }
          check result-tarball bitcoin-31.1-arm-linux-gnueabihf.tar.gz
          check result-debug-tarball bitcoin-31.1-arm-linux-gnueabihf-debug.tar.gz

  build-ppc64:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: cachix/cachix-action@v17
        with:
          name: 0xb10c-bitcoind-gunix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix build .#tarballPpc64 -o result-tarball --print-build-logs
      - run: nix build .#debugTarballPpc64 -o result-debug-tarball --print-build-logs
      - name: Verify powerpc64-linux-gnu archives match checked-in noncodesigned.SHA256SUMS
        run: |
          check() { # <result-path> <published-filename>
            expected=$(awk -v f="$2" '$2==f{print $1}' noncodesigned.SHA256SUMS)
            [ -n "$expected" ] || { echo "MISSING: $2 not in noncodesigned.SHA256SUMS"; return 1; }
            actual=$(sha256sum "$1" | cut -d' ' -f1)
            echo "$2"; echo "  expected: $expected"; echo "  actual:   $actual"
            [ "$actual" = "$expected" ]
          }
          check result-tarball bitcoin-31.1-powerpc64-linux-gnu.tar.gz
          check result-debug-tarball bitcoin-31.1-powerpc64-linux-gnu-debug.tar.gz

  # The two macOS releases, cross-built on the same x86_64 runner with the
  # bare clang/lld 19.1.4 toolchain + the Xcode SDK (fetched from the public
  # bitcoincore.org mirror). Each job builds the full chain for one host —
  # the three noncodesigned artifacts (-unsigned.tar.gz/.zip,
  # -codesigning.tar.gz) self-gate against the checked-in
  # noncodesigned.SHA256SUMS; the signed .tar.gz/.zip are built ungated
  # (all.SHA256SUMS not published yet). The bitcoind step builds inside an
  # unshare/userns chroot (for byte-identical LC_UUIDs), which needs
  # CLONE_NEWUSER; Ubuntu 24.04+'s AppArmor unprivileged_userns_restriction
  # blocks that for unconfined processes (`unshare: write failed
  # /proc/self/uid_map: Operation not permitted`), so each job first
  # disables it via sysctl. The SDK-embedding closures ARE pushed to Cachix
  # (the SDK is already public on the depends-sources mirror).
  build-darwin-x86:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: cachix/cachix-action@v17
        with:
          name: 0xb10c-bitcoind-gunix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Allow unprivileged user namespaces (needed for the darwin chroot build)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: nix build .#tarballDarwinX86 -o result-unsigned-tar --print-build-logs
      - run: nix build .#zipDarwinX86 -o result-unsigned-zip --print-build-logs
      - run: nix build .#codesigningDarwinX86 -o result-codesigning --print-build-logs
      - run: nix build .#signedDarwinX86 -o result-signed --print-build-logs
      - name: Verify x86_64-apple-darwin artifacts match checked-in noncodesigned.SHA256SUMS
        run: |
          check() { # <result-path> <published-filename>
            expected=$(awk -v f="$2" '$2==f{print $1}' noncodesigned.SHA256SUMS)
            [ -n "$expected" ] || { echo "MISSING: $2 not in noncodesigned.SHA256SUMS"; return 1; }
            actual=$(sha256sum "$1" | cut -d' ' -f1)
            echo "$2"; echo "  expected: $expected"; echo "  actual:   $actual"
            [ "$actual" = "$expected" ]
          }
          check result-unsigned-tar bitcoin-31.1-x86_64-apple-darwin-unsigned.tar.gz
          check result-unsigned-zip bitcoin-31.1-x86_64-apple-darwin-unsigned.zip
          check result-codesigning bitcoin-31.1-x86_64-apple-darwin-codesigning.tar.gz

  build-darwin-arm64:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: cachix/cachix-action@v17
        with:
          name: 0xb10c-bitcoind-gunix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Allow unprivileged user namespaces (needed for the darwin chroot build)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: nix build .#tarballDarwinArm64 -o result-unsigned-tar --print-build-logs
      - run: nix build .#zipDarwinArm64 -o result-unsigned-zip --print-build-logs
      - run: nix build .#codesigningDarwinArm64 -o result-codesigning --print-build-logs
      - run: nix build .#signedDarwinArm64 -o result-signed --print-build-logs
      - name: Verify arm64-apple-darwin artifacts match checked-in noncodesigned.SHA256SUMS
        run: |
          check() { # <result-path> <published-filename>
            expected=$(awk -v f="$2" '$2==f{print $1}' noncodesigned.SHA256SUMS)
            [ -n "$expected" ] || { echo "MISSING: $2 not in noncodesigned.SHA256SUMS"; return 1; }
            actual=$(sha256sum "$1" | cut -d' ' -f1)
            echo "$2"; echo "  expected: $expected"; echo "  actual:   $actual"
            [ "$actual" = "$expected" ]
          }
          check result-unsigned-tar bitcoin-31.1-arm64-apple-darwin-unsigned.tar.gz
          check result-unsigned-zip bitcoin-31.1-arm64-apple-darwin-unsigned.zip
          check result-codesigning bitcoin-31.1-arm64-apple-darwin-codesigning.tar.gz

  # win64 (x86_64-w64-mingw32). The steps build + assert the 4 published
  # noncodesigned archive/installer artifacts (unsigned + debug zips, NSIS
  # installer, codesigning tarball); the signed installer + signed zip are
  # built ungated (all.SHA256SUMS not published yet).
  build-win64:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: cachix/cachix-action@v17
        with:
          name: 0xb10c-bitcoind-gunix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix build .#bitcoindMingw -o result-bitcoind --print-build-logs
      - run: nix build .#unsignedZipMingw -o result-unsigned-zip --print-build-logs
      - run: nix build .#debugZipMingw -o result-debug-zip --print-build-logs
      - run: nix build .#setupExeMingw -o result-setup-unsigned --print-build-logs
      - run: nix build .#codesigningMingw -o result-codesigning --print-build-logs
      - run: nix build .#signedMingw -o result-signed --print-build-logs
      - name: Verify win64 archive/installer artifacts match checked-in noncodesigned.SHA256SUMS
        run: |
          check() { # <result-path> <published-filename>
            expected=$(awk -v f="$2" '$2==f{print $1}' noncodesigned.SHA256SUMS)
            [ -n "$expected" ] || { echo "MISSING: $2 not in noncodesigned.SHA256SUMS"; return 1; }
            actual=$(sha256sum "$1" | cut -d' ' -f1)
            echo "$2"; echo "  expected: $expected"; echo "  actual:   $actual"
            [ "$actual" = "$expected" ]
          }
          check result-unsigned-zip bitcoin-31.1-win64-unsigned.zip
          check result-debug-zip bitcoin-31.1-win64-debug.zip
          check result-setup-unsigned bitcoin-31.1-win64-setup-unsigned.exe
          check result-codesigning bitcoin-31.1-win64-codesigning.tar.gz

  # "Cross everywhere" verification on an AARCH64 build host. The flake
  # exposes the same pipeline per build system (attr names refer to the
  # TARGET), so on this arm runner `.#tarballAarch64` is an aarch64
  # cross-to-self build (the trivial cross) and `.#tarball` is the x86_64
  # release cross-compiled FROM aarch64. Every derivation gates the exact
  # same upstream hashes as the x86_64-hosted jobs above — success here
  # proves the outputs are build-host-independent. Nothing in these jobs
  # shares store paths with the x86_64-hosted Cachix entries (different
  # build-host drvs), so the first run is a long cold build; Cachix caches
  # subsequent runs.
  build-on-aarch64-host:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: cachix/cachix-action@v17
        with:
          name: 0xb10c-bitcoind-gunix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix build .#tarballAarch64 -o result-tarball --print-build-logs
      - name: Verify aarch64-on-aarch64 (cross-to-self) tarball matches checked-in noncodesigned.SHA256SUMS
        run: |
          expected=$(awk '$2=="bitcoin-31.1-aarch64-linux-gnu.tar.gz"{print $1}' noncodesigned.SHA256SUMS)
          actual=$(sha256sum result-tarball | cut -d' ' -f1)
          echo "expected: $expected"
          echo "actual:   $actual"
          [ -n "$expected" ] && [ "$actual" = "$expected" ]

  build-x86-target-on-aarch64-host:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: cachix/cachix-action@v17
        with:
          name: 0xb10c-bitcoind-gunix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix build .#tarball -o result-tarball --print-build-logs
      - name: Verify x86_64-from-aarch64 tarball matches checked-in noncodesigned.SHA256SUMS
        run: |
          expected=$(awk '$2=="bitcoin-31.1-x86_64-linux-gnu.tar.gz"{print $1}' noncodesigned.SHA256SUMS)
          actual=$(sha256sum result-tarball | cut -d' ' -f1)
          echo "expected: $expected"
          echo "actual:   $actual"
          [ -n "$expected" ] && [ "$actual" = "$expected" ]

  # The aggregator — `.#noncodesignedSha256sums` rebuilds upstream's
  # noncodesigned.SHA256SUMS from every released artifact. Each sub-
  # derivation already self-gates against the checked-in file, and this
  # job diffs the aggregate against it byte-for-byte — the project-wide
  # reproducibility proof. `.#sha256sums` (all.SHA256SUMS, incl. the
  # signed artifacts + codesignatures archive) is built and shown but
  # not compared: upstream's all.SHA256SUMS is not published yet. This
  # job depends on every per-target build job so all sub-drvs are cache
  # hits via Cachix; the only fresh work is the aggregator files.
  build-sha256sums:
    runs-on: ubuntu-latest
    needs:
      - build
      - build-aarch64
      - build-riscv64
      - build-armhf
      - build-ppc64
      - build-darwin-x86
      - build-darwin-arm64
      - build-win64

    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: cachix/cachix-action@v17
        with:
          name: 0xb10c-bitcoind-gunix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      # The darwin unsigned tarballs build inside an unshare/userns
      # chroot (LC_UUID byte-identity); if anything below the aggregator
      # is a Cachix miss the rebuild needs CLONE_NEWUSER, blocked by
      # Ubuntu 24.04+'s AppArmor unprivileged_userns_restriction.
      - name: Allow unprivileged user namespaces (darwin sub-drv rebuild fallback)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: nix build .#noncodesignedSha256sums -o result-noncodesigned-sha256sums --print-build-logs
      - name: Verify aggregator matches checked-in noncodesigned.SHA256SUMS
        run: diff noncodesigned.SHA256SUMS result-noncodesigned-sha256sums
      - run: nix build .#sha256sums -o result-sha256sums --print-build-logs
      - name: Show all.SHA256SUMS contents (no upstream reference yet)
        run: cat result-sha256sums
