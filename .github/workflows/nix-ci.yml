  # The armhf and powerpc64 releases. The bitcoind drv gates assert all
  # 20 artifacts (10 binaries + 10 .dbg) internally; these jobs re-assert
  # both archive sha256s externally.
  build-armhf:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
