        run: |
          expected=dc7ba69a377bf0f1965e6938054642a0d779886d83f96e8bbf63471f478ca7c6
          actual=$(sha256sum result-tarball | cut -d' ' -f1)
          echo "release expected: $expected"
          echo "release actual:   $actual"
